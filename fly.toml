# fly.toml app configuration file generated for kilo-models-dashboard on 2026-11-14T11:02:44Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'kilo-models-dashboard'
primary_region = 'cdg'
console_command = '/code/manage.py shell'

[build]
[env]
  PORT = '8000'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256

[[statics]]
  guest_path = '/code/static'
  url_prefix = '/static/'
